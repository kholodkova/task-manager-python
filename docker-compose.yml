# Практическая работа № 3: приложение, PostgreSQL и миграции.
# Запуск приложения: docker compose up -d --build
# Запуск тестов: docker compose --profile test run --rm tests
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports: ["5432:5432"]
    volumes:
      # Данные хранятся в томе pgdata и сохраняются при перезапуске контейнера.
      - pgdata:/var/lib/postgresql/data
      # При первом создании тома скрипт добавляет отдельную тестовую БД tasks_test.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "tasks"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    ports: ["8000:8000"]
    # Сначала применяются миграции, затем запускается приложение.
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
