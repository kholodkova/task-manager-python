# Конфигурация Alembic для асинхронной PostgreSQL.

[alembic]
# Папка со сценариями миграций.
script_location = %(here)s/migrations

# Корень проекта добавляется в путь импорта Python.
prepend_sys_path = .

# Для разделения путей используется разделитель текущей ОС.
path_separator = os

# Строка подключения подставляется из DATABASE_URL в migrations/env.py.
sqlalchemy.url =

[post_write_hooks]

# Настройка логирования Alembic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
